name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Prettier was configured from the start and gated nowhere, so three test
      # files had quietly drifted out of format. Cheap, and it keeps diffs about
      # the change rather than about whitespace.
      - name: Format check
        run: npm run format:check

      - name: Typecheck (src + test/unit)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build # tsc (noEmit typecheck) + vite build -> dist/

      # playwright and @playwright/test are pinned to the same exact version
      # (see playwright.config.ts header), so this one install covers the
      # browser revision both the bespoke runner and @playwright/test need —
      # no separate install step before the E2E (playwright specs) step below.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (serve build + interact)
        run: |
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node test/interact.mjs

      - name: E2E (playwright specs)
        env:
          KP_E2E_PORT: '4174'
        run: npx playwright test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
